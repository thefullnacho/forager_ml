name: ops

on:
  push:
    paths:
      - "ops/**"
      - ".github/workflows/ops.yml"
  pull_request:
    paths:
      - "ops/**"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      # No Postgres, no GPU, no model, no forager-obs -- the watchdog logic is
      # pure stdlib on purpose, so this workflow runs anywhere and stays fast.
      - run: pip install pytest
      - name: Watchdog + status logic
        run: python -m pytest ops/tests/ -q
